# Versions pinned by card-billing-modernization/ARCHITECTURE.md. This file is the local stand-in
# for `card-billing-shared/versions/libs.versions.toml` until that repo exists — see the comment
# in settings.gradle.kts.

[versions]
springBoot = "4.1.0"
springdoc = "3.1.0"
resilience4j = "2.4.0"
archunit = "1.5.0"
wiremock = "3.13.2"
testcontainersRedis = "2.2.4"
assertj = "3.27.7"

[libraries]
springdoc-openapi-starter-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
# ARCHITECTURE.md pins resilience4j-spring-boot3 2.3.0. That flavour autoconfigures against
# Spring Boot 3; this service runs Boot 4.1, whose autoconfiguration packages moved. Resilience4j
# ships a dedicated Boot 4 flavour (resilience4j-spring-boot4) — same library, same 2.x line,
# built for the framework version this initiative actually pins.
resilience4j-spring-boot = { module = "io.github.resilience4j:resilience4j-spring-boot4", version.ref = "resilience4j" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
wiremock-standalone = { module = "org.wiremock:wiremock-standalone", version.ref = "wiremock" }
testcontainers-redis = { module = "com.redis:testcontainers-redis", version.ref = "testcontainersRedis" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
